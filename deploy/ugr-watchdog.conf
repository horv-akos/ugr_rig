# /etc/systemd/system.conf.d/ugr-watchdog.conf
#
# The Pi's hardware watchdog (bcm2835_wdt). systemd resets it every few seconds; if the Pi
# hangs so hard that even systemd cannot run for RuntimeWatchdogSec, the chip reboots it. That is
# a clean reboot instead of pulling the power, which is what risks the SD card. The Pi's watchdog
# counts to about 15 s at most, hence 14 s. RebootWatchdogSec: a reboot that itself hangs is
# forced after 2 min. Takes effect after `sudo systemctl daemon-reexec` or a reboot.
[Manager]
RuntimeWatchdogSec=14s
RebootWatchdogSec=2min
