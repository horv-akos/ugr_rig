# /etc/systemd/journald.conf.d/90-ugr-persistent.conf
#
# Keep the log over a reboot, so after a freeze there is something to read (2026-11-26: there
# was not). If `journalctl --list-boots` shows only the current boot, the journal lives in RAM
# and is lost at every power cycle; the 90- prefix sorts after any drop-in of the OS that sets
# that, so this one wins. 200 MB at most on the SD card. Written
# to the card every minute instead of every 5: the last minutes before a power cut are the ones
# that matter. Needs the directory: sudo mkdir -p /var/log/journal (deploy/README.md §8).
[Journal]
Storage=persistent
SystemMaxUse=200M
SyncIntervalSec=1m
