<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14181d">
<title>Studies · UGR rig</title>
<link rel="stylesheet" href="/static/style.css">
<script type="module" src="/static/home.js"></script>
</head>
<body>
<header class="top">
  <div class="brand">UGR rig</div>
  <nav aria-label="Pages">
    <a class="active" href="/home" aria-current="page">Home</a>
    <a href="/movement">Movement</a>
    <a href="/camera">Camera</a>
  </nav>
  <div id="conn" class="conn" role="status">connecting…</div>
</header>

<main class="home">
  <section class="panel start-panel" aria-label="New study">
    <h2>New study</h2>
    <form id="start-form" class="start-form">
      <label>Position profile
        <select name="profile" id="profile" required></select></label>
      <label>Camera profile
        <select name="camera_profile" id="camprof"></select></label>
      <fieldset class="lighting">
        <legend>Lighting</legend>
        <label><input type="radio" name="lighting" value="dark" checked> Dark (night, darkened hall)</label>
        <label><input type="radio" name="lighting" value="daylight"> Daylight</label>
      </fieldset>
      <label>Operator<input name="operator" maxlength="80" autocomplete="off"></label>
      <label>Notes<textarea name="notes" rows="2" maxlength="2000"
        placeholder="Configuration, cab lights on/off, anything that changes the numbers"></textarea></label>
      <label class="check"><input type="checkbox" name="sweep" checked> Hemisphere sweep for L_b
        <span class="muted">(skipping it makes L_b provisional)</span></label>
      <label class="check"><input type="checkbox" name="check" checked> Check position at the end
        <span class="muted">(repeatability)</span></label>
      <ul id="preflight" class="preflight" aria-live="polite"></ul>
      <button type="submit" id="start" class="primary big">Start recording</button>
      <p class="hint" id="disk"></p>
    </form>
  </section>

  <section class="panel run-panel" aria-label="Study">
    <div class="run-head">
      <h2 id="study-title">Study</h2>
      <span id="study-status" class="pill"></span>
    </div>
    <div id="study-empty" class="muted">No study selected. Start one, or pick one from the library.</div>
    <div id="study-body" hidden>
      <dl id="study-meta" class="info"></dl>
      <ol id="steps" class="steps"></ol>
      <div class="summary" id="summary"></div>
      <figure id="forward" class="forward" hidden>
        <a id="covmap-link" target="_blank" title="Open full size"><img id="covmap" alt="Coverage of the forward field, and the sources rated against the forward gaze"></a>
        <figcaption id="fw-top" class="small"></figcaption>
      </figure>
      <ul id="study-flags" class="flags"></ul>
      <div class="row">
        <button id="stop" class="stop" hidden>STOP recording</button>
        <a id="excel" class="button" download hidden>Excel workbook</a>
        <a id="zip" class="button" download>Results (.zip)</a>
        <button id="reanalyse" class="quiet" hidden>Re-analyse</button>
      </div>
    </div>
  </section>

  <section class="panel results-panel" aria-label="Results">
    <div class="results-head">
      <h2>Results</h2>
      <div id="views" class="seggroup views" role="group" aria-label="Picture shown"></div>
    </div>
    <div id="cards" class="cards"></div>
  </section>

  <section class="panel library-panel" aria-label="Library">
    <h2>Library</h2>
    <div class="row">
      <input id="search" type="search" placeholder="Search profile, vehicle, operator, notes…" autocomplete="off">
    </div>
    <div class="table-wrap">
      <table class="library">
        <thead><tr><th>Started (UTC)</th><th>Profile</th><th>Vehicle</th><th>Lighting</th>
          <th>Operator</th><th class="num">Max UGR</th><th>Status</th></tr></thead>
        <tbody id="library-rows"></tbody>
      </table>
    </div>
  </section>
</main>
</body>
</html>
