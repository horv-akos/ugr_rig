# Pan-tilt head configuration.
#
# Values marked MEASURE are placeholders. Replace them with numbers taken off
# the built head before trusting any commanded angle - docs/PIVOT_DETAIL.md §8.

[mount]
motor_steps_per_rev = 200       # NEMA 17, 1.8 deg
microsteps = 16                 # set over UART (CHOPCONF.MRES). MS1/MS2 are UART address
                                # straps: without UART config PAN runs 1/8, TILT 1/32
pulse_width_us = 5              # STEP high time; TMC2209 needs >= 100 ns
dir_setup_us = 100              # DIR settled before the first step
enable_settle_ms = 50           # driver charge pump after ENABLE goes low
settle_ms = 800                 # MEASURE: dwell after motion before capture

[pins]                          # BCM numbering. 18 and 19 are reserved by pigpio.
pan_step = 17
pan_dir = 27
tilt_step = 22
tilt_dir = 23
enable = 24
enable_active_low = true        # 10k pull-up holds the drivers off when the Pi is not driving

# Gear ratio, per axis: EITHER the two tooth counts OR a plain gear_ratio
# (motor turns per output turn), never both. Use gear_ratio to drop in a value
# measured with `mountctl ratio`; comment out the tooth counts when you do.

[axis.pan]
gear_teeth_driver = 17          # motor pinion
gear_teeth_driven = 144         # base gear -> 8.4706, 75.29 steps/deg
# gear_ratio = 8.470588
invert = false                  # flip if positive degrees turn the wrong way
min_deg = -170.0                # MEASURE: drive to interference by hand, back off
max_deg = 170.0                 # MEASURE
max_speed_deg_s = 5.0
accel_deg_s2 = 5.0              # 1 s ramp to max speed
start_speed_deg_s = 0.25
backlash_deg = 0.5              # MEASURE: overshoot margin when reversing
approach_sign = 1               # always arrive at a target moving positive

[axis.tilt]
gear_teeth_driver = 21
gear_teeth_driven = 64          # 3.0476, 27.09 steps/deg. Confirmed with the angle
                                # gauge. Upstream's 123:16 belt constant is wrong for
                                # this build (would scale every tilt angle 2.52x).
# gear_ratio = 3.047619
invert = false
min_deg = -45.0                 # MEASURE
max_deg = 60.0                  # MEASURE
max_speed_deg_s = 5.0
accel_deg_s2 = 5.0
start_speed_deg_s = 0.25
backlash_deg = 0.5              # MEASURE
approach_sign = 1
